version: '3.8'

services:
  # Graph Database
  neo4j:
    image: neo4j:latest
    container_name: chimpanzee-neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j:/data # Mounts your preprocessed graph data

  # FastAPI Backend
  backend:
    build: .
    container_name: chimpanzee-api
    command: uvicorn application.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - .:/app # Live code mounting
    depends_on:
      - neo4j

  # Streamlit Frontend
  frontend:
    build: .
    container_name: chimpanzee-ui
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend

networks:
  default:
    name: chimpanzee-network